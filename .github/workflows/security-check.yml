name: 🔒 Security Check

# Quando rodar este workflow
on:
  # A cada push nas branches principais
  push:
    branches: [main, aula-1, aula-6]
  # A cada Pull Request para main
  pull_request:
    branches: [main]

# Jobs a executar
jobs:
  security:
    name: Security & Quality Check
    runs-on: ubuntu-latest
    
    steps:
      # 1. Fazer checkout do código
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      # 2. Setup Node.js
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
      
      # 3. Instalar dependências
      - name: 📦 Install dependencies
        run: yarn install --frozen-lockfile
      
      # 4. Audit de segurança
      # Falha se encontrar vulnerabilidade HIGH ou CRITICAL
      - name: 🔒 Security audit
        run: yarn audit --level high
      
      # 5. Build (garantir que compila)
      - name: 🏗️ Build project
        run: yarn build
        env:
          # Supabase vars necessárias para build
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      
      # 6. (Opcional) Rodar testes
      # Descomente quando tiver testes implementados
      # - name: 🧪 Run tests
      #   run: yarn test

